name: Keep Supabase Alive

on:
  schedule:
    # Run every 3 days at midnight UTC to prevent auto-pausing (which happens after 7 days of inactivity)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual run from the GitHub Actions tab

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY secrets are not set in GitHub repository secrets."
            exit 1
          fi

          # Clean and format the base URL
          BASE_URL=$(echo "$SUPABASE_URL" | xargs | sed 's:/*$::')

          if [[ ! "$BASE_URL" =~ ^https?:// ]]; then
            BASE_URL="https://$BASE_URL"
          fi

          # Target the RPC keep_alive function (or fallback to projects table)
          TARGET_URL="${BASE_URL}/rest/v1/rpc/keep_alive"

          echo "Pinging Supabase database..."

          # Send POST request to RPC function to execute real database work
          CURL_OUTPUT=$(curl -sS -w "\n%{http_code}" \
            -X POST "$TARGET_URL" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' 2>&1) || CURL_EXIT=$?

          if [ -n "$CURL_EXIT" ] && [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::cURL connection failed with exit code $CURL_EXIT"
            echo "Output/Error details: $CURL_OUTPUT"
            echo "Action required: Ensure your project is unpaused in the Supabase Dashboard and SUPABASE_URL is correct."
            exit 1
          fi

          RESPONSE_CODE=$(echo "$CURL_OUTPUT" | tail -n 1)
          RESPONSE_BODY=$(echo "$CURL_OUTPUT" | sed '$d')

          # If RPC function hasn't been created yet (returns 404), fallback to projects table query
          if [ "$RESPONSE_CODE" -eq 404 ]; then
            echo "RPC function keep_alive not found. Falling back to table query..."
            CURL_OUTPUT=$(curl -sS -w "\n%{http_code}" \
              -X GET "${BASE_URL}/rest/v1/projects?select=id&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" 2>&1)
            RESPONSE_CODE=$(echo "$CURL_OUTPUT" | tail -n 1)
            RESPONSE_BODY=$(echo "$CURL_OUTPUT" | sed '$d')
          fi

          echo "HTTP response code: $RESPONSE_CODE"

          if [ "$RESPONSE_CODE" -eq 200 ] || [ "$RESPONSE_CODE" -eq 204 ]; then
            echo "Successfully pinged Supabase!"
          else
            echo "::error::Failed to ping Supabase. Response code: $RESPONSE_CODE"
            if [ -n "$RESPONSE_BODY" ]; then
              echo "Response body: $RESPONSE_BODY"
            fi
            exit 1
          fi
