name: Keep Supabase Alive

on:
  schedule:
    # Run every 2 days at midnight UTC to safely prevent auto-pausing (which happens after 7 days)
    - cron: '0 0 */2 * *'
  workflow_dispatch: # Allows manual run from the GitHub Actions tab

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY secrets are not set in GitHub repository secrets."
            exit 1
          fi

          # Clean and format the base URL
          BASE_URL=$(echo "$SUPABASE_URL" | xargs | sed 's:/*$::')

          if [[ ! "$BASE_URL" =~ ^https?:// ]]; then
            BASE_URL="https://$BASE_URL"
          fi

          # Extract hostname to verify which project is actually being pinged
          TARGET_HOST=$(echo "$BASE_URL" | sed -e 's|^[^/]*//||' -e 's|/.*$||')
          echo "Targeting Supabase host: $TARGET_HOST"

          if [[ "$TARGET_HOST" == *"bmvrbuvjjtgchowvknut"* ]]; then
            echo "Confirmed: Pinging Portfolio Supabase project (bmvrbuvjjtgchowvknut)"
          else
            echo "::warning::The configured SUPABASE_URL ($TARGET_HOST) does NOT match the Portfolio project (bmvrbuvjjtgchowvknut)! Please check your GitHub Secrets."
          fi

          # Target the RPC keep_alive function
          TARGET_URL="${BASE_URL}/rest/v1/rpc/keep_alive"

          echo "Sending keep-alive request to database..."

          CURL_OUTPUT=$(curl -sS -w "\n%{http_code}" \
            -X POST "$TARGET_URL" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' 2>&1) || CURL_EXIT=$?

          if [ -n "$CURL_EXIT" ] && [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::cURL network connection failed with exit code $CURL_EXIT"
            echo "Output: $CURL_OUTPUT"
            exit 1
          fi

          RESPONSE_CODE=$(echo "$CURL_OUTPUT" | tail -n 1)
          RESPONSE_BODY=$(echo "$CURL_OUTPUT" | sed '$d')

          # If RPC function hasn't been created yet (returns 404), fallback to projects table query
          if [ "$RESPONSE_CODE" -eq 404 ]; then
            echo "RPC function keep_alive not found (HTTP 404). Falling back to projects table query..."
            CURL_OUTPUT=$(curl -sS -w "\n%{http_code}" \
              -X GET "${BASE_URL}/rest/v1/projects?select=id&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" 2>&1)
            RESPONSE_CODE=$(echo "$CURL_OUTPUT" | tail -n 1)
            RESPONSE_BODY=$(echo "$CURL_OUTPUT" | sed '$d')
          fi

          echo "HTTP response code: $RESPONSE_CODE"

          if [ "$RESPONSE_CODE" -eq 540 ]; then
            echo "::error::Supabase project is currently PAUSED (HTTP 540). You must go to the Supabase Dashboard and click 'Restore project' manually first."
            exit 1
          elif [ "$RESPONSE_CODE" -eq 200 ] || [ "$RESPONSE_CODE" -eq 204 ]; then
            echo "Successfully pinged Supabase database! Keep-alive confirmed."
          else
            echo "::error::Failed to ping Supabase. Response code: $RESPONSE_CODE"
            if [ -n "$RESPONSE_BODY" ]; then
              echo "Response body: $RESPONSE_BODY"
            fi
            exit 1
          fi
